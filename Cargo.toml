[package]
name = "infostop"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Detect stop locations in GPS and mobility trajectory data (Infostop algorithm)"
license = "MIT"
readme = "README.md"
keywords = ["gps", "mobility", "clustering", "trajectory", "stops"]
categories = ["science", "algorithms"]
repository = "https://github.com/deangrant/infostop"

[features]
default = []
plot = []

[dependencies]

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "plot_stops"
path = "examples/plot_stops.rs"
required-features = ["plot"]

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
